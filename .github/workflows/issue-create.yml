name: Create Issue on Push
on: push
permissions:
  issues: write
jobs:
  create-issue:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ACTOR: ${{ github.actor }}
      COMMIT_SHA: ${{ github.sha }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}

    steps:
      - name: Create issue with GitHub CLI
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues" \
            -f title="New push by $ACTOR" \
            -f body="Commit: $COMMIT_SHA / Message: $COMMIT_MSG" \
            --jq '.html_url'